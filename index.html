<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Tower Defence - Arena</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:#171b25; color:#f4f6fb; font-family:Arial,sans-serif; display:flex; flex-direction:column; align-items:center; padding:24px 12px; }
  h1 { margin:0 0 8px; font-size:24px; }
  .hint { color:#b8c0d2; margin:0 0 16px; font-size:14px; text-align:center; }
  .layout { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  #arena { width:520px; height:520px; max-width:calc(100vw - 24px); max-height:calc(100vw - 24px); aspect-ratio:1; position:relative; overflow:hidden; border:1px solid #e7eaf0; background-color:#6b8f52; background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px); background-size:26px 26px; box-shadow:0 12px 36px #0007; }
  .unit { position:absolute; width:100px; height:60px; object-fit:contain; user-select:none; pointer-events:none; filter:drop-shadow(0 3px 2px #0008); }
  .panel { width:250px; background:#242b39; border:1px solid #3a4559; border-radius:12px; padding:16px; }
  button { width:100%; border:0; border-radius:8px; padding:12px; color:white; background:#3984ed; font-weight:bold; font-size:15px; cursor:pointer; margin:6px 0 12px; }
  button:hover { background:#5596f3; }
  button.secondary { background:#4a5568; }
  label { display:block; color:#c6cede; font-size:13px; margin:8px 0 5px; }
  input { width:100%; padding:9px; border-radius:7px; border:1px solid #536078; color:white; background:#151b27; }
  .small { color:#aeb8ca; font-size:12px; line-height:1.5; }
  #count { font-weight:bold; color:#9dc4ff; }
  .money { margin:4px 0 8px; font-size:18px; font-weight:bold; color:#ffd66b; }
  .money strong { font-size:24px; }
  @media (max-width:560px) { .panel { width:min(520px,calc(100vw - 24px)); } }
</style>
</head>
<body>
<h1>IMAGE TOWER DEFENCE</h1>
<p class="hint">520 × 520 경기장 · 소환 이미지 100 × 60</p>
<div class="layout">
  <div id="arena" aria-label="게임 경기장"></div>
  <section class="panel">
    <div class="money">보유 원: <strong id="money">0</strong> / 1000원</div>
    <button id="spawn">남자 소환 (10원)</button>
    <button id="clear" class="secondary">모두 제거</button>
    <label for="imageUrl">소환할 이미지의 직접 이미지 주소</label>
    <input id="imageUrl" type="url" value="https://www.pngall.com/wp-content/uploads/8/Man-PNG-Free-Download.png">
    <p class="small">1초마다 10원이 자동으로 쌓여. 최대 보유 금액은 1000원이야. 남자 한 명을 소환할 때마다 10원이 사용돼.</p>
    <p>소환된 이미지: <span id="count">0</span></p>
    <p class="small">이미지들은 경기장 안에서 자동으로 움직이고, 테두리에 닿으면 방향을 바꿔.</p>
  </section>
</div>
<script>
(() => {
  const arena = document.getElementById('arena');
  const spawnBtn = document.getElementById('spawn');
  const clearBtn = document.getElementById('clear');
  const imageInput = document.getElementById('imageUrl');
  const countEl = document.getElementById('count');
  const moneyEl = document.getElementById('money');
  let money = 0;
  function updateMoney(){ moneyEl.textContent = money; spawnBtn.disabled = money < 10; spawnBtn.textContent = money < 10 ? '남자 소환 (10원 필요)' : '남자 소환 (10원)'; }
  setInterval(() => { money = Math.min(1000, money + 10); updateMoney(); }, 1000);
  const units = [];
  const SIZE_W = 100, SIZE_H = 60, SPEED = 85;
  let last = performance.now();
  function updateCount(){ countEl.textContent = units.length; }
  function spawn(){
    if (money < 10) return;
    money -= 10;
    updateMoney();
    const img = document.createElement('img');
    img.className = 'unit';
    const src = imageInput.value.trim();
    if (src) { img.src = src; img.alt = '소환된 유닛'; }
    else {
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="60" viewBox="0 0 100 60"><ellipse cx="50" cy="51" rx="35" ry="6" fill="#000" opacity=".22"/><rect x="10" y="7" width="80" height="42" rx="10" fill="#e9edf4" stroke="#273247" stroke-width="3"/><text x="50" y="34" text-anchor="middle" font-size="13" font-family="Arial" font-weight="bold" fill="#273247">IMAGE</text></svg>');
    }
    const x = Math.random() * (520 - SIZE_W), y = Math.random() * (520 - SIZE_H), angle = Math.random() * Math.PI * 2;
    arena.appendChild(img);
    units.push({el:img,x,y,vx:Math.cos(angle)*SPEED,vy:Math.sin(angle)*SPEED});
    updateCount();
  }
  function tick(now){
    const dt = Math.min((now-last)/1000, .04); last = now;
    for(const u of units){
      u.x += u.vx*dt; u.y += u.vy*dt;
      if(u.x < 0){u.x=0;u.vx=Math.abs(u.vx);}
      if(u.y < 0){u.y=0;u.vy=Math.abs(u.vy);}
      if(u.x > 520-SIZE_W){u.x=520-SIZE_W;u.vx=-Math.abs(u.vx);}
      if(u.y > 520-SIZE_H){u.y=520-SIZE_H;u.vy=-Math.abs(u.vy);}
      u.el.style.left = u.x+'px'; u.el.style.top = u.y+'px';
    }
    updateMoney();
  requestAnimationFrame(tick);
  }
  spawnBtn.addEventListener('click',spawn);
  clearBtn.addEventListener('click',()=>{for(const u of units)u.el.remove();units.length=0;updateCount();});
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
