<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Tower Defence</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#171b25;color:#f4f6fb;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 12px}h1{margin:0 0 8px;font-size:24px}.hint{color:#b8c0d2;margin:0 0 16px;font-size:14px;text-align:center}.layout{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
#arena{width:520px;height:520px;max-width:calc(100vw - 24px);max-height:calc(100vw - 24px);aspect-ratio:1;position:relative;overflow:hidden;border:1px solid #e7eaf0;background-color:#6b8f52;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:26px 26px;box-shadow:0 12px 36px #0007}
.unit{position:absolute;object-fit:contain;user-select:none;pointer-events:none;filter:drop-shadow(0 3px 2px #0008)}.man{width:100px;height:60px}.rat{width:48px;height:36px}.cat{width:56px;height:44px;font-size:38px;line-height:44px;text-align:center}
.hp{position:absolute;z-index:4;transform:translateX(-50%);font-size:10px;line-height:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000,1px 0 #000,-1px 0 #000;pointer-events:none;white-space:nowrap}
#ratGate{position:absolute;z-index:3;left:50%;top:5px;transform:translateX(-50%);width:42px;height:42px;border-radius:50%;background:#050505;border:2px solid #333;box-shadow:0 2px 6px #0009}
.panel{width:250px;background:#242b39;border:1px solid #3a4559;border-radius:12px;padding:16px}button{width:100%;border:0;border-radius:8px;padding:12px;color:white;background:#3984ed;font-weight:bold;font-size:15px;cursor:pointer;margin:6px 0 12px}button:hover{background:#5596f3}button:disabled{background:#596273;cursor:not-allowed}button.secondary{background:#4a5568}.small{color:#aeb8ca;font-size:12px;line-height:1.5}#count{font-weight:bold;color:#9dc4ff}.money{margin:4px 0 8px;font-size:18px;font-weight:bold;color:#ffd66b}.money strong{font-size:24px}@media(max-width:560px){.panel{width:min(520px,calc(100vw - 24px))}}
</style>
</head>
<body>
<h1>IMAGE TOWER DEFENCE</h1>
<p class="hint">520 × 520 경기장 · 남자와 쥐가 서로 싸워!</p>
<div class="layout">
<div id="arena" aria-label="게임 경기장"><div id="ratGate" title="쥐 출구"></div></div>
<section class="panel">
<div class="money">보유 원: <strong id="money">0</strong> / 1000원</div>
<button id="spawn">남자 소환 (30원)</button>
<button id="clear" class="secondary">모두 제거</button>
<p class="small">0.1초마다 1원씩 획득해. 최대 1000원이며 남자 한 명 소환에 30원이 필요해.</p>
<p>남자: 체력 10 · 공격력 1</p>
<p>쥐: 체력 2 · 공격력 1 · 1초마다 출구에서 생성</p>
<p>고양이: 체력 5 · 공격력 3 · 쥐 5마리 처치 시 한 번 등장</p>
<p>쥐 처치 수: <span id="ratKills">0</span> / 5</p>
<p>현재 유닛: <span id="count">0</span></p>
<p class="small">체력은 각 유닛 위에 작게 표시돼. 같은 편끼리 부딪히면 밀려나고, 적과 부딪히면 서로 공격해.</p>
</section>
</div>
<script>
(() => {
 const arena=document.getElementById('arena'),gate=document.getElementById('ratGate'),spawnBtn=document.getElementById('spawn'),clearBtn=document.getElementById('clear'),moneyEl=document.getElementById('money'),countEl=document.getElementById('count'),ratKillsEl=document.getElementById('ratKills');
 const MAN_SRC='https://www.pngall.com/wp-content/uploads/8/Man-PNG-Free-Download.png';
 const RAT_PAGE='https://kor.pngtree.com/freepng/rat-mouse-animal_19778482.html';
 const MAN_W=100,MAN_H=60,RAT_W=48,RAT_H=36,SPEED_MAN=170,SPEED_RAT=150;
 let money=0,last=performance.now(),lastRat=performance.now(),lastCat=0,ratsKilled=0; const units=[];
 function updateMoney(){moneyEl.textContent=money;spawnBtn.disabled=money<30;spawnBtn.textContent=money<30?'남자 소환 (30원 필요)':'남자 소환 (30원)'}
 function updateCount(){countEl.textContent=units.length}
 setInterval(()=>{money=Math.min(1000,money+1);updateMoney()},100);
 function ratFallback(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="96" height="72" viewBox="0 0 96 72"><path d="M18 47 Q-2 52 9 65" fill="none" stroke="#777" stroke-width="4" stroke-linecap="round"/><ellipse cx="48" cy="43" rx="29" ry="19" fill="#999"/><circle cx="71" cy="34" r="14" fill="#aaa"/><circle cx="64" cy="20" r="8" fill="#d99"/><circle cx="78" cy="22" r="7" fill="#d99"/><circle cx="76" cy="32" r="2.5" fill="#111"/><circle cx="85" cy="40" r="3" fill="#d77"/></svg>')}
 function addUnit(type,x,y,vx,vy){
  const el=type==='cat'?document.createElement('div'):document.createElement('img');el.className='unit '+type;
  if(type==='cat'){el.textContent='🐈';el.setAttribute('aria-label','고양이')}
  else {el.alt=type==='man'?'남자':'쥐';el.src=type==='man'?MAN_SRC:RAT_PAGE;if(type==='rat')el.onerror=()=>{el.onerror=null;el.src=ratFallback()}}
  const hpLabel=document.createElement('div');hpLabel.className='hp';hpLabel.textContent=type==='man'?'10':type==='cat'?'5':'2';arena.append(el,hpLabel);
  const u={type,el,hpLabel,x,y,vx,vy,w:type==='man'?MAN_W:type==='cat'?56:RAT_W,h:type==='man'?MAN_H:type==='cat'?44:RAT_H,health:type==='man'?10:type==='cat'?5:2,damage:type==='cat'?3:1,attackCooldown:0};
  units.push(u);position(u);updateCount();return u;
 }
 function position(u){u.el.style.left=u.x+'px';u.el.style.top=u.y+'px';u.hpLabel.textContent=String(Math.max(0,Math.ceil(u.health)));u.hpLabel.style.left=(u.x+u.w/2)+'px';u.hpLabel.style.top=Math.max(0,u.y-13)+'px'}
 function spawnMan(){if(money<30)return;money-=30;updateMoney();const a=Math.random()*Math.PI*2;addUnit('man',Math.random()*420,Math.random()*460,Math.cos(a)*SPEED_MAN,Math.sin(a)*SPEED_MAN)}
 function spawnRat(){const x=236,y=48;addUnit('rat',x,y,(Math.random()-.5)*40,SPEED_RAT)}
 function spawnCat(){const x=40+Math.random()*380,y=420+Math.random()*50;addUnit('cat',x,y,(Math.random()-.5)*SPEED_MAN,(Math.random()-.5)*SPEED_MAN)}
 function bounceWalls(u){if(u.x<0){u.x=0;u.vx=Math.abs(u.vx)}if(u.y<0){u.y=0;u.vy=Math.abs(u.vy)}if(u.x>520-u.w){u.x=520-u.w;u.vx=-Math.abs(u.vx)}if(u.y>520-u.h){u.y=520-u.h;u.vy=-Math.abs(u.vy)}}
 function overlaps(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
 function removeDead(){for(let i=units.length-1;i>=0;i--){const u=units[i];if(u.health<=0){u.el.remove();u.hpLabel.remove();units.splice(i,1);if(u.type==='rat'){ratsKilled++;ratKillsEl.textContent=ratsKilled;money=Math.min(1000,money+10);updateMoney()}else if(u.type==='cat'){money=Math.min(1000,money+20);updateMoney()}}}}
 function tick(now){
  const dt=Math.min((now-last)/1000,.04);last=now;
  if(now-lastRat>=1000){spawnRat();lastRat=now}
  if(ratsKilled>=5&&now-lastCat>=2000){spawnCat();lastCat=now}
  for(const u of units){u.x+=u.vx*dt;u.y+=u.vy*dt;u.attackCooldown=Math.max(0,u.attackCooldown-dt);bounceWalls(u)}
  // 모든 유닛은 서로 겹치지 않도록 밀어내고, 적끼리는 접촉 시 공격한다.
  for(let i=0;i<units.length;i++)for(let j=i+1;j<units.length;j++){
   const a=units[i],b=units[j];if(!overlaps(a,b))continue;
   const dx=(a.x+a.w/2)-(b.x+b.w/2),dy=(a.y+a.h/2)-(b.y+b.h/2),dist=Math.hypot(dx,dy)||1;
   const nx=dx/dist,ny=dy/dist,overlap=Math.min(a.x+a.w-b.x,b.x+b.w-a.x,a.y+a.h-b.y,b.y+b.h-a.y);
   a.x+=nx*overlap*.25;a.y+=ny*overlap*.25;b.x-=nx*overlap*.25;b.y-=ny*overlap*.25;
   if((a.type==='man')!==(b.type==='man')){if(a.attackCooldown<=0){b.health-=a.damage;a.attackCooldown=.65}if(b.attackCooldown<=0){a.health-=b.damage;b.attackCooldown=.65}}
   else {const av=a.vx*nx+a.vy*ny,bv=b.vx*nx+b.vy*ny;a.vx+=(bv-av)*nx*.8;a.vy+=(bv-av)*ny*.8;b.vx+=(av-bv)*nx*.8;b.vy+=(av-bv)*ny*.8}
  }
  for(const u of units){bounceWalls(u);position(u)}
  removeDead();requestAnimationFrame(tick)
 }
 spawnBtn.addEventListener('click',spawnMan);
 clearBtn.addEventListener('click',()=>{for(const u of units){u.el.remove();u.hpLabel.remove()}units.length=0;updateCount()});
 updateMoney();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
